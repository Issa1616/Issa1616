<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1200" height="350" rx="18" fill="#20391D"></rect>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#F7F0E5">
    <path d="M0 70H1200"></path>
    <path d="M0 140H1200"></path>
    <path d="M0 210H1200"></path>
    <path d="M0 280H1200"></path>
    <path d="M100 0V350"></path>
    <path d="M200 0V350"></path>
    <path d="M300 0V350"></path>
    <path d="M400 0V350"></path>
    <path d="M500 0V350"></path>
    <path d="M600 0V350"></path>
    <path d="M700 0V350"></path>
    <path d="M800 0V350"></path>
    <path d="M900 0V350"></path>
    <path d="M1000 0V350"></path>
    <path d="M1100 0V350"></path>
  </g>

  <!-- Terminal header -->
  <rect x="35" y="25" width="1130" height="38" rx="8" fill="#F7F0E5" fill-opacity="0.05" stroke="#8B9251" stroke-opacity="0.35"></rect>

  <!-- Terminal buttons -->
  <circle cx="58" cy="44" r="5" fill="#8B9251"></circle>
  <circle cx="77" cy="44" r="5" fill="#8B9251" fill-opacity="0.65"></circle>
  <circle cx="96" cy="44" r="5" fill="#8B9251" fill-opacity="0.35"></circle>

  <text x="120" y="49" fill="#F7F0E5" fill-opacity="0.65" font-family="monospace" font-size="13">
    issa@dev:~
  </text>

  <text x="1095" y="49" fill="#8B9251" font-family="monospace" font-size="12">
    ONLINE
  </text>

  <!-- Left main panel -->
  <rect x="35" y="82" width="570" height="205" rx="12" fill="#F7F0E5" fill-opacity="0.025" stroke="#8B9251" stroke-opacity="0.25"></rect>

  <!-- Main prompt -->
  <text x="65" y="115" fill="#8B9251" font-family="monospace" font-size="13">
    issa@dev:~$ whoami
  </text>

  <!-- Name -->
  <text x="65" y="155" fill="#F7F0E5" font-family="monospace" font-size="28" font-weight="700">
    ISSA VICTORIA
  </text>

  <text x="65" y="187" fill="#F7F0E5" font-family="monospace" font-size="28" font-weight="700">
    AGUILAR SOTO
  </text>

  <!-- Role -->
  <text x="65" y="220" fill="#8B9251" font-family="monospace" font-size="14">
    SOFTWARE DEVELOPER
  </text>

  <text x="65" y="244" fill="#F7F0E5" fill-opacity="0.65" font-family="monospace" font-size="12">
    SYSTEMS ENGINEERING STUDENT
  </text>

  <text x="65" y="270" fill="#F7F0E5" fill-opacity="0.45" font-family="monospace" font-size="11">
    SONORA, MEXICO
  </text>

  <!-- Right information panel -->
  <rect x="630" y="82" width="535" height="205" rx="12" fill="#F7F0E5" fill-opacity="0.025" stroke="#8B9251" stroke-opacity="0.25"></rect>

  <!-- Focus -->
  <text x="660" y="112" fill="#8B9251" font-family="monospace" font-size="12">
    issa@dev:~$ focus
  </text>

  <text x="660" y="138" fill="#F7F0E5" font-family="monospace" font-size="12">
    WEB
  </text>

  <text x="725" y="138" fill="#F7F0E5" font-family="monospace" font-size="12">
    BACKEND
  </text>

  <text x="825" y="138" fill="#F7F0E5" font-family="monospace" font-size="12">
    MOBILE
  </text>

  <text x="910" y="138" fill="#F7F0E5" font-family="monospace" font-size="12">
    DATABASES
  </text>

  <!-- Technologies -->
  <text x="660" y="169" fill="#8B9251" font-family="monospace" font-size="12">
    issa@dev:~$ stack
  </text>

  <text x="660" y="193" fill="#F7F0E5" fill-opacity="0.7" font-family="monospace" font-size="11">
    PHP · LARAVEL · JAVA · C# · .NET
  </text>

  <text x="660" y="214" fill="#F7F0E5" fill-opacity="0.7" font-family="monospace" font-size="11">
    ANGULAR · TYPESCRIPT · NODE · FLUTTER
  </text>

  <text x="660" y="235" fill="#F7F0E5" fill-opacity="0.7" font-family="monospace" font-size="11">
    POSTGRESQL · MYSQL · MONGODB
  </text>

  <!-- Status -->
  <text x="660" y="262" fill="#8B9251" font-family="monospace" font-size="11">
    STATUS
  </text>

  <!-- Status bar -->
  <rect x="720" y="253" width="270" height="8" rx="4" fill="#F7F0E5" fill-opacity="0.08"></rect>

  <rect x="720" y="253" width="225" height="8" rx="4" fill="#8B9251"></rect>

  <text x="1005" y="262" fill="#F7F0E5" fill-opacity="0.55" font-family="monospace" font-size="10">
    LEARNING
  </text>

  <!-- Bottom command -->
  <rect x="35" y="302" width="1130" height="28" rx="7" fill="#8B9251" fill-opacity="0.08"></rect>

  <text x="55" y="321" fill="#8B9251" font-family="monospace" font-size="12">
    issa@dev:~$
  </text>

  <text x="165" y="321" fill="#F7F0E5" fill-opacity="0.85" font-family="monospace" font-size="12">
    build --learn --create --repeat
  </text>

  <!-- Cursor -->
  <rect x="420" y="309" width="7" height="14" fill="#8B9251"></rect>

</svg>